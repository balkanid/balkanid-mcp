name: 💡 Enhancement or feature request
description: "An idea to improve this repo: a plugin manifest, docs, or registry metadata."
title: "[Enhancement]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea.

        This is the place for improvements to what's in this repo: the plugin manifests,
        client-specific manifests, docs, and registry metadata.

        Want a new tool or product capability in the hosted BalkanID MCP Server itself? Raise it
        through [support@balkan.id](mailto:support@balkan.id) so it actually reaches the product
        team.
  - type: checkboxes
    id: dedup
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: What would you like to improve?
      options:
        - Plugin manifest
        - Client manifest / new client support
        - README / documentation
        - MCP registry entry (server.json)
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and what's missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've already tried or considered?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
