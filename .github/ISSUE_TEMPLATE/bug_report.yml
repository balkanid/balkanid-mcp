name: 🐞 Bug report
description: "Something wrong in this repo's contents: README/docs, plugin manifests, or server.json."
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        This is the right place for problems with what lives in this repo: the README and docs, the
        plugin manifests (`plugin.json`, `mcp.json`, `.mcp.json`, `.claude-plugin/`,
        `.cursor-plugin/`, `gemini-extension.json`), and the MCP registry entry (`server.json`).

        If the bug is in the hosted server itself (something `mcp.balkanid.app` does, sign-in, tool
        behavior, or permissions), email [support@balkan.id](mailto:support@balkan.id) instead —
        that reaches the team who can actually act on it faster than a repo issue. Not sure which it
        is? File here anyway and we'll point you the right way.
  - type: checkboxes
    id: dedup
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - README / documentation
        - Plugin manifest (plugin.json / mcp.json)
        - Client manifest (Claude / Cursor / Gemini / .mcp.json)
        - MCP registry entry (server.json)
        - Not sure / other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what's wrong and where you ran into it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: If you can, list the steps and paste any error output.
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: input
    id: client
    attributes:
      label: MCP client and version (if it's relevant)
      placeholder: e.g. Claude Desktop 1.2.3, Cursor 0.42, VS Code Copilot
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links, screenshots, or anything else that helps.
